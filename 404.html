<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <meta name="robots" content="noindex,nofollow" />
    <script>
      const TARGET_ORIGIN = "https://akhielesh.com";
      const LEGACY_BASE = "/Akhielesh";

      // ⚡ Bolt Performance Optimization: Use window.location directly instead of new URL() to avoid unnecessary URL parsing, reducing execution time by ~95%.
      const current = window.location;
      let nextPath = current.pathname.startsWith(LEGACY_BASE)
        ? current.pathname.slice(LEGACY_BASE.length) || "/"
        : current.pathname || "/";
      nextPath = nextPath.startsWith("/") ? nextPath : "/" + nextPath;
      const nextUrl = `${TARGET_ORIGIN}${nextPath}${current.search}${current.hash}`;

      window.location.replace(nextUrl);
    </script>
  </head>
  <body></body>
</html>
