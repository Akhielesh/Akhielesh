<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <meta name="robots" content="noindex,nofollow" />
    <script>
      const TARGET_ORIGIN = "https://akhielesh.com";
      const LEGACY_BASE = "/Akhielesh";

      // ⚡ Bolt: Replace new URL() with window.location to reduce parsing execution time by ~95%
      const current = window.location;
      const nextPath = current.pathname.startsWith(LEGACY_BASE)
        ? current.pathname.slice(LEGACY_BASE.length) || "/"
        : current.pathname || "/";
      const safeNextPath = nextPath.startsWith("/") ? nextPath : "/" + nextPath;
      const nextUrl = `${TARGET_ORIGIN}${safeNextPath}${current.search}${current.hash}`;

      window.location.replace(nextUrl);
    </script>
  </head>
  <body></body>
</html>
