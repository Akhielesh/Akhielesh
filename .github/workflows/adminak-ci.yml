name: Adminak CI

on:
  push:
    branches: [main]
    paths:
      - "adminak/**"
      - ".github/workflows/adminak-ci.yml"
  pull_request:
    paths:
      - "adminak/**"
      - ".github/workflows/adminak-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adminak-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adminak
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adminak/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t adminak:ci adminak
      - name: Smoke test
        run: |
          docker run -d --name adminak -p 8787:8787 -e APP_URL=http://localhost:8787 adminak:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8787/healthz; then exit 0; fi
            sleep 2
          done
          docker logs adminak
          exit 1
